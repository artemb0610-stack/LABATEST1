# XcodeGen: из этого файла собирается ios/Kopilka.xcodeproj (делает GitHub Actions, workflow «Xcode project»).
# Исходники общие с Kopilka.swiftpm — правите Swift-файлы там, проект подхватит их сам.
name: Kopilka
options:
  bundleIdPrefix: ru.hackathon
  developmentLanguage: ru
  deploymentTarget:
    iOS: "17.0"
targets:
  Kopilka:
    type: application
    platform: iOS
    sources:
      - path: Kopilka.swiftpm
        excludes:
          - Package.swift
          - README.md
          - "*.log"
          - "*.json.tmp"
          - shots
          - dd
    settings:
      base:
        PRODUCT_NAME: Kopilka
        PRODUCT_BUNDLE_IDENTIFIER: ru.hackathon.kopilka.prettynumbers
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Копилка
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
