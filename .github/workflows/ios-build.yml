name: iOS build

on:
  push:
    paths:
      - "ios/**"
      - "config/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build app sources (XcodeGen project, iOS Simulator)
        run: |
          brew install xcodegen
          cd ios/ci
          xcodegen generate
          set -o pipefail
          xcodebuild -project KopilkaCI.xcodeproj -scheme Kopilka \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug build CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | grep -E "error:|warning: unre|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Build Kopilka.swiftpm (as opened in Xcode)
        continue-on-error: true
        run: |
          cd ios/Kopilka.swiftpm
          xcodebuild -list || true
          SCHEME=$(xcodebuild -list -json 2>/dev/null | python3 -c "import json,sys; d=json.load(sys.stdin); print((d.get('workspace') or d.get('project') or {}).get('schemes',[''])[0])")
          echo "scheme: $SCHEME"
          set -o pipefail
          xcodebuild -scheme "$SCHEME" -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO 2>&1 | tee pkg.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" pkg.log
