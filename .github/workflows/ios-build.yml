name: iOS build check

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)" || true
          xcodebuild -version

      - name: Typecheck all Swift sources (iOS 17 simulator SDK)
        working-directory: ios/Kopilka.swiftpm
        shell: bash
        run: |
          printf 'import Foundation\nextension Bundle { static var module: Bundle { .main } }\n' > /tmp/BundleStub.swift
          set +e
          xcrun --sdk iphonesimulator swiftc -typecheck -parse-as-library \
            -target arm64-apple-ios17.0-simulator \
            $(find . -name "*.swift" ! -name Package.swift) /tmp/BundleStub.swift > typecheck.log 2>&1
          code=$?
          cat typecheck.log
          # ошибки компилятора → аннотации на странице запуска
          grep -E "^[^ ]+\.swift:[0-9]+:[0-9]+: error:" typecheck.log | head -50 | while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1); l=$(echo "$line" | cut -d: -f2); m=$(echo "$line" | cut -d: -f5-)
            echo "::error file=ios/Kopilka.swiftpm/${f#./},line=$l::$m"
          done
          exit $code

      - name: Build the app package with xcodebuild
        if: always()
        working-directory: ios/Kopilka.swiftpm
        shell: bash
        run: |
          xcodebuild -list -json > list.json 2>/dev/null || true
          cat list.json || true
          SCHEME=$(python3 -c "import json;d=json.load(open('list.json'));w=d.get('workspace') or d.get('project') or {};s=w.get('schemes',[]);print(s[0] if s else '')" 2>/dev/null)
          echo "scheme: $SCHEME"
          set +e
          xcodebuild -scheme "$SCHEME" -destination "generic/platform=iOS Simulator" \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | head -60
          grep -E "^/.+\.swift:[0-9]+:[0-9]+: error:" build.log | sort -u | head -50 | while IFS= read -r line; do
            f=$(echo "$line" | cut -d: -f1); l=$(echo "$line" | cut -d: -f2); m=$(echo "$line" | cut -d: -f5-)
            echo "::error file=${f##*/},line=$l::$m"
          done
          exit $code

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-logs
          path: |
            ios/Kopilka.swiftpm/typecheck.log
            ios/Kopilka.swiftpm/build.log
